name: nightly

# Runs the full test suite plus the health check against the deployed dev URL.
# When a scheduled workflow fails, GitHub emails the repository owner by
# default — no extra notification setup needed.

on:
  schedule:
    # 03:00 UTC every day
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-tests:
    name: lint + unit + e2e + health
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: UTC
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: E2E tests
        run: npm run test:e2e

      - name: Health check (deployed CloudFront URL)
        run: npm run test:health

      - name: Upload Playwright reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-reports
          path: |
            playwright-report/
            test-results/
          retention-days: 14
